    <text x='92.5' y='25' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='13' font-weight='600' fill='#FAF8F5' letter-spacing='0.3'>rumo-works.vercel.app</text>
