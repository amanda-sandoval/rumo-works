<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1128 191' width='1128' height='191'>
  <rect width='1128' height='191' fill='#3B5A4B'/>

  <!-- TARGET / RADAR GRAPHIC: Center shifted to cx=280 so center & inner rings emerge right beside avatar -->
  <g opacity='0.95'>
    <!-- Center focal point & inner rings (fully visible right beside the avatar) -->
    <circle cx='280' cy='100' r='7' fill='#A95840' opacity='0.85'/>
    <circle cx='280' cy='100' r='22' stroke='#A95840' stroke-width='1.5' opacity='0.45' fill='none'/>
    <circle cx='280' cy='100' r='55' stroke='#FAF8F5' stroke-width='1.4' stroke-dasharray='4 4' opacity='0.3' fill='none'/>
    <circle cx='280' cy='100' r='95' stroke='#A95840' stroke-width='1.8' stroke-dasharray='5 5' opacity='0.4' fill='none'/>
    <circle cx='280' cy='100' r='150' stroke='#FAF8F5' stroke-width='1.5' stroke-dasharray='7 7' opacity='0.22' fill='none'/>
    <circle cx='280' cy='100' r='215' stroke='#FAF8F5' stroke-width='1.2' stroke-dasharray='9 9' opacity='0.16' fill='none'/>
    <circle cx='280' cy='100' r='290' stroke='#A95840' stroke-width='1.2' stroke-dasharray='10 10' opacity='0.18' fill='none'/>
    <circle cx='280' cy='100' r='380' stroke='#FAF8F5' stroke-width='1' stroke-dasharray='12 12' opacity='0.1' fill='none'/>

    <!-- Crosshair Axis Lines radiating out from the target center -->
    <line x1='60' y1='100' x2='550' y2='100' stroke='#FAF8F5' stroke-width='1' stroke-dasharray='4 8' opacity='0.2'/>
    <line x1='280' y1='0' x2='280' y2='191' stroke='#FAF8F5' stroke-width='1' stroke-dasharray='4 8' opacity='0.2'/>
    <line x1='165' y1='0' x2='395' y2='191' stroke='#FAF8F5' stroke-width='1' stroke-dasharray='3 9' opacity='0.12'/>
  </g>

  <!-- RIGHT: Brand Identity & Large Proportional Typography (Shifted right to x=580) -->
  <g transform='translate(575, 44)'>
    <!-- Sage Logo Emblem -->
    <rect width='98' height='98' rx='25' fill='#2E473B' stroke='#4A705D' stroke-width='1.5'/>
    <circle cx='49' cy='49' r='31' stroke='#EBF1ED' stroke-width='2.4' stroke-dasharray='4 4' opacity='0.4'/>
    <path d='M34 64L64 34M64 34H44M64 34V54' stroke='#FAF8F5' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/>
    <circle cx='90' cy='8' r='8' fill='#A95840' stroke='#3B5A4B' stroke-width='2'/>
  </g>

  <!-- Typography shifted right -->
  <!-- Rumo WORKS -->
  <text x='698' y='88' font-family='Georgia, serif' font-size='56' font-weight='600' fill='#FAF8F5' letter-spacing='-1'>Rumo</text>
  <text x='862' y='88' font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size='28' font-weight='700' fill='#D3DFD6' letter-spacing='6'>WORKS</text>

  <!-- Tagline in 2 lines -->
  <text x='700' y='124' font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size='16.5' font-weight='500' fill='#FAF8F5' letter-spacing='0.25' opacity='0.98'>Clareza de direção e estratégia prática</text>
  <text x='700' y='150' font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size='15.5' font-weight='400' fill='#D3DFD6' letter-spacing='0.25' opacity='0.88'>para o seu próximo rumo profissional.</text>
</svg>